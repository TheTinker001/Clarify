name: Close inactive tickets

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call Django endpoint
        run: |
          curl -fsS -X POST \
            -H "X-CRON-TOKEN: ${{ secrets.CRON_TOKEN }}" \
            https://clarify.pythonanywhere.com/tasks/close-inactive/
