<h4 class="mb-0">{{ title }}</h4>
<p class="mt-3">
    {% if all_selected %}
        All
    {% elif labels %}
        {% for label in labels %}
            {{ label }}
            {% if not forloop.last %},{% endif %}
            <br>
        {% empty %}
            —
        {% endfor %}
    {% else %}
        _
    {% endif %}
</p>
