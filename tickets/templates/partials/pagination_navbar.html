{% if page_obj and page_obj.has_other_pages %}
    <nav aria-label="Page navigation">
        <ul class="pagination justify-content-center mb-0">
            <li class="page-item">
                {% if page_obj.has_previous %}
                    <a class="page-link"
                       href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.previous_page_number }}">
                        <i class="bi bi-arrow-left"></i>
                    </a>
                {% else %}
                    <a class="page-link"><i class="bi bi-arrow-left"></i></a>
                {% endif %}
            </li>
            {% for number in page_obj.paginator.page_range %}
                <li class="page-item {% if page_obj.number == number %}active{% endif %}">
                    <a class="page-link"
                       href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ number }}">{{ number }}</a>
                </li>
            {% endfor %}
            <li class="page-item">
                {% if page_obj.has_next %}
                    <a class="page-link"
                       href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.next_page_number }}">
                        <i class="bi bi-arrow-right"></i>
                    </a>
                {% else %}
                    <a class="page-link"><i class="bi bi-arrow-right"></i></a>
                {% endif %}
            </li>
        </ul>
    </nav>
{% endif %}
