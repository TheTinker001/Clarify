<div class="card mt-3">
    <div class="card-body">
        <h6 class="card-title">Add a comment</h6>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="hidden" name="action" value="add_comment">
            {{ form.body }}
            {% if form.body.errors %}<div class="text-danger mt-1">{{ form.body.errors }}</div>{% endif %}
            <div class="mt-2">{{ form.attachments }}</div>
            {% if form.attachments.errors %}<div class="text-danger mt-1">{{ form.attachments.errors }}</div>{% endif %}
            <button type="submit" class="btn btn-primary mt-2">
                <i class="bi bi-send-fill me-2"></i>
                Submit
            </button>
        </form>
    </div>
</div>
