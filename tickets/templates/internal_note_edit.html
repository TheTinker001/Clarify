{% extends "base_content.html" %}
{% block content %}
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h4>Internal Notes — Ticket #{{ ticket.id }}</h4>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        {{ form.internal_notes }}
                        {% if form.internal_notes.errors %}<div class="text-danger mt-1">{{ form.internal_notes.errors }}</div>{% endif %}
                    </div>
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a href="{{ ticket.get_absolute_url }}" class="btn btn-secondary ms-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
