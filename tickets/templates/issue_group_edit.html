{% extends 'base_content.html' %}
{% block content %}
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <h2 class="mb-3">Edit Issue group name</h2>
                <div class="card">
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}
                            {{ form.name }}
                            {% if form.name.errors %}<div class="text-danger mt-1">{{ form.name.errors }}</div>{% endif %}
                            <div class="mt-3 d-flex gap-2">
                                <button type="submit" class="btn btn-primary">Save changes</button>
                                <a href="{% url 'issue_group_detail' slug=object.slug %}"
                                   class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
